name: Build safe macOS artifacts
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      SAFE_VERSION: ${{ inputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      T3CODE_TELEMETRY_ENABLED: "false"
      T3CODE_DISABLE_AUTO_UPDATE: "true"
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.13.1"
      - name: Verify runner and dependency baseline before install
        run: |
          test "$(uname -m)" = arm64
          node scripts/safe/workflow-scan.ts
          node scripts/safe/egress-scan.ts
          node scripts/safe/dependency-scan.ts
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "24.13.1"
          run-install: false
          cache: false
      - run: vp install --frozen-lockfile
      - run: |
          node scripts/safe/policy-verify.ts
          node scripts/safe/stage-lock-scan.ts
      - name: Build desktop DMG
        run: |
          node scripts/build-desktop-artifact.ts --platform mac --target dmg --arch arm64 \
            --build-version "$SAFE_VERSION" --output-dir release-safe
          dmg=(release-safe/*.dmg)
          test "${#dmg[@]}" -eq 1
          mv "${dmg[0]}" "release-safe/t3safe-${SAFE_VERSION}-darwin-arm64.dmg"
      - name: Inspect policy and endpoints inside the built DMG
        run: |
          node scripts/safe/desktop-smoke.ts "release-safe/t3safe-${SAFE_VERSION}-darwin-arm64.dmg" --artifact-report release-safe/dmg-host-report.json
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.8.2"
      - name: Build standalone CLI and resource monitor
        env:
          # Node single-executable builds need >= 25.7; vp otherwise runs its own pinned Node.
          VP_NODE_VERSION: "26.8.2"
        run: |
          node scripts/update-release-package-versions.ts "$SAFE_VERSION"
          node apps/server/scripts/cli.ts build-exe --target darwin-arm64 --verbose
          # Preserve the exact SEA input under stable scanner-relative paths, without runner metadata.
          mkdir "$RUNNER_TEMP/cli-build"
          cp apps/server/dist-exe/bin.mjs "$RUNNER_TEMP/cli-build/bin.mjs"
          cp -R apps/server/dist/client "$RUNNER_TEMP/cli-build/client"
          cargo build --locked --release --target aarch64-apple-darwin --manifest-path native/resource-monitor/Cargo.toml
          mkdir -p "$RUNNER_TEMP/cli-resource-monitor/darwin-arm64"
          cp native/resource-monitor/target/aarch64-apple-darwin/release/t3-resource-monitor "$RUNNER_TEMP/cli-resource-monitor/darwin-arm64/"
          node scripts/build-cli-archive.ts --platform mac --arch arm64 --version "$SAFE_VERSION" \
            --resource-monitor-dir "$RUNNER_TEMP/cli-resource-monitor" --output-dir release-safe
          mv "release-safe/t3-${SAFE_VERSION}-darwin-arm64.tar.gz" "release-safe/t3safe-${SAFE_VERSION}-darwin-arm64.tar.gz"
      - name: Verify baked CLI policy without a listener or provider processes
        run: |
          mkdir "$RUNNER_TEMP/safe-smoke"
          tar -xzf "release-safe/t3safe-${SAFE_VERSION}-darwin-arm64.tar.gz" -C "$RUNNER_TEMP/safe-smoke"
          executable="$RUNNER_TEMP/safe-smoke/t3-${SAFE_VERSION}-darwin-arm64/t3"
          node scripts/safe/egress-smoke.ts "$executable"
          status=0
          node scripts/safe/policy-verify.ts --cli-bundle "$RUNNER_TEMP/cli-build" || status=1
          node scripts/safe/artifact-scan.ts "$RUNNER_TEMP/cli-build" --report release-safe/cli-build-host-report.json || status=1
          node scripts/safe/artifact-scan.ts "$RUNNER_TEMP/safe-smoke/t3-${SAFE_VERSION}-darwin-arm64" --report release-safe/cli-archive-host-report.json || status=1
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: t3safe-cli-scan-input
          path: ${{ runner.temp }}/cli-build/
          if-no-files-found: warn
          retention-days: 7
      - name: Package management command, policy and checksums
        run: |
          cp scripts/safe/t3safe release-safe/t3safe
          cp security/managed-policy.json release-safe/managed-policy.json
          printf '%s\n' "v$SAFE_VERSION" > release-safe/VERSION
          cp install.sh release-safe/install.sh
          rm -f release-safe/*.zip release-safe/*.blockmap release-safe/*.yml release-safe/*.yaml
          cd release-safe
          shasum -a 256 ./*.dmg ./*.tar.gz t3safe managed-policy.json VERSION install.sh > SHA256SUMS
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: t3safe-release
          path: release-safe/
          if-no-files-found: error
          retention-days: 7
