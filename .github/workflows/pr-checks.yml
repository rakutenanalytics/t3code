name: Safe fork PR checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: safe-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  policy:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.12.1"
      - name: Scan source and dependencies before install
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/safe/workflow-scan.ts "$BASE_SHA"
          node scripts/safe/egress-scan.ts
          node scripts/safe/dependency-scan.ts
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version: "26.12.1"
          run-install: false
          cache: false
      - run: vp install --frozen-lockfile
      - run: |
          node scripts/safe/policy-verify.ts
          node scripts/safe/stage-lock-scan.ts
      - name: Run focused managed policy tests
        run: |
          vp test run scripts/safe/managed-policy.test.ts apps/server/src/telemetry/ManagedGates.test.ts apps/desktop/src/updates/ManagedUpdates.test.ts
          vp test run scripts/safe/artifact-scan.test.ts scripts/safe/desktop-smoke-command.test.ts
          vp test run scripts/safe/dependency-comparison.test.ts scripts/safe/dependency-registry.test.ts scripts/safe/dependency-scan.test.ts
          vp test run apps/mobile/src/features/settings/environment-maintenance.test.ts apps/server/src/cli/thread.test.ts apps/server/src/project/RepositoryIdentityResolver.test.ts apps/server/src/provider/ModelManifest.test.ts packages/provider-muse/src/server/maintenance.test.ts apps/desktop/scripts/electron-runtime-integrity.test.mjs
          vp test run scripts/build-npm-launcher.test.ts
          vp test run scripts/build-desktop-artifact.test.ts -t "installs production dependencies with the reviewed frozen lockfile"
      - name: Install test browser and verify disabled action
        run: |
          node apps/web/node_modules/playwright/cli.js install --only-shell chromium
          cd apps/web
          vp test run src/components/ManagedPolicyDisabledAction.browser.test.tsx src/components/chat/MermaidDiagram.browser.test.tsx --project browser
      - name: Typecheck managed packages and consumers
        run: |
          vp exec --filter @t3tools/contracts -- tsc --noEmit
          vp exec --filter @t3tools/shared -- tsc --noEmit
          vp exec --filter @t3tools/client-runtime -- tsc --noEmit
          vp exec --filter t3 -- tsc --noEmit
          vp exec --filter @t3tools/desktop -- tsc --noEmit
          vp exec --filter @t3tools/web -- tsc --noEmit
          vp exec --filter @t3tools/scripts -- tsc --noEmit
      - name: Lint and format touched files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/safe/touched-checks.ts "$BASE_SHA"
      - name: Check installer shell
        run: |
          brew install shellcheck
          bash -n install.sh scripts/safe/t3safe
          shellcheck install.sh scripts/safe/t3safe
          bash install.sh --dry-run --version v0.1.0-safe.0 --prefix "$RUNNER_TEMP/t3safe-install"
  dependency-online:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "26.12.1"
      - name: Check registry metadata against the PR base
        id: scan
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:security/dependency-baseline.json" > "$RUNNER_TEMP/dependency-base.json"
          node scripts/safe/dependency-scan.ts --online --age-only --baseline "$RUNNER_TEMP/dependency-base.json"
      - name: Upload dependency review report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-review
          path: security/young-or-unknown.json
          if-no-files-found: warn
      - name: Record advisory scan failure
        if: always() && steps.scan.outcome != 'success'
        run: |
          echo '::warning::Online dependency scan needs review. Registry failures remain unknown; inspect the dependency-review artifact and sync review verdicts.'
          echo 'Online dependency scan did not pass. Review the job log and dependency-review artifact; this advisory job does not authorize publication.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
  artifacts:
    uses: ./.github/workflows/safe-build.yml
    with:
      version: 0.1.0-safe.0
    permissions:
      contents: read
