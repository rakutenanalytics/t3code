name: Publish safe release
on:
  push:
    tags: ["v*-safe.*"]
permissions:
  contents: read
concurrency:
  group: safe-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'rakutenanalytics/t3code'
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        name: Require a safe tag on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-safe\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
  build:
    needs: preflight
    uses: ./.github/workflows/safe-build.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
    permissions:
      contents: read
  publish:
    needs: [preflight, build]
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: t3safe-release
          path: release-safe
      - name: Publish public release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd release-safe
          shasum -a 256 --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./* --repo rakutenanalytics/t3code \
            --verify-tag --latest --title "T3 Code $RELEASE_TAG" \
            --notes 'Managed macOS Apple Silicon build. Unsigned/ad-hoc signed. See docs/safe-fork/INSTALL.md for installation and policy limits.'
