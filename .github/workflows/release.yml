name: Publish safe release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Safe tag to publish or retry; omit to choose the next tag"
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: safe-release
  cancel-in-progress: false
jobs:
  plan:
    if: github.repository == 'rakutenanalytics/t3code' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 25
    outputs:
      release: ${{ steps.plan.outputs.release }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      commit: ${{ steps.plan.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
      - id: plan
        name: Choose a safe tag for the reviewed main commit
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          upstream_version=$(node -p 'JSON.parse(require("node:fs").readFileSync("security/last-approved-upstream", "utf8")).tag.replace(/^v/, "")')
          [[ "$upstream_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          tag_prefix="v${upstream_version}-safe."
          release_tag="$REQUESTED_TAG"

          # Explicit tags allow retrying publication of an already-tagged commit.
          if [[ -z "$release_tag" ]]; then
            if git tag --points-at HEAD | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-safe\.[0-9]+$'; then
              echo 'release=false' >> "$GITHUB_OUTPUT"
              echo 'This commit already has a safe tag; skipping release.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            next=0
            while IFS= read -r existing_tag; do
              suffix=${existing_tag#"$tag_prefix"}
              if [[ "$suffix" =~ ^[0-9]+$ ]] && (( 10#$suffix >= next )); then
                next=$((10#$suffix + 1))
              fi
            done < <(git tag --list "${tag_prefix}*")
            release_tag="${tag_prefix}${next}"
          fi

          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-safe\.[0-9]+$ ]]
          [[ "$release_tag" == "$tag_prefix"* ]]
          if git show-ref --verify --quiet "refs/tags/$release_tag"; then
            test "$(git rev-list -n 1 "$release_tag")" = "$(git rev-parse HEAD)"
          fi
          node scripts/safe/release-guard.ts "$release_tag"
          echo 'release=true' >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Scan source and dependencies before install
        if: steps.plan.outputs.release == 'true'
        run: |
          node scripts/safe/workflow-scan.ts
          node scripts/safe/egress-scan.ts
          node scripts/safe/dependency-scan.ts
      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        if: steps.plan.outputs.release == 'true'
        with:
          node-version: "26.12.1"
          run-install: false
          cache: false
      - if: steps.plan.outputs.release == 'true'
        run: vp install --frozen-lockfile
      - if: steps.plan.outputs.release == 'true'
        run: |
          node scripts/safe/policy-verify.ts
          node scripts/safe/stage-lock-scan.ts
  build:
    needs: plan
    if: needs.plan.outputs.release == 'true' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    environment: release
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      SAFE_VERSION: ${{ needs.plan.outputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      T3CODE_TELEMETRY_ENABLED: "false"
      T3CODE_DISABLE_AUTO_UPDATE: "false"
      T3CODE_MOBILE_UPDATES_ENABLED: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - name: Import the stable release identity into an ephemeral keychain
        env:
          SAFE_SIGNING_P12_BASE64: ${{ secrets.SAFE_SIGNING_P12_BASE64 }}
          SAFE_SIGNING_P12_PASSWORD: ${{ secrets.SAFE_SIGNING_P12_PASSWORD }}
        run: bash scripts/safe/import-signing-key.sh
      - uses: ./.github/actions/build-safe
      - name: Delete release signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/t3safe-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/t3safe-signing.p12" "$RUNNER_TEMP/t3safe-signing.pem"
  publish:
    needs: [plan, build]
    if: needs.plan.outputs.release == 'true'
    runs-on: macos-15
    environment: release
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.12.1"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: t3safe-release
          path: release-safe
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release-safe/*.dmg
            release-safe/*.zip
            release-safe/*.blockmap
            release-safe/latest-mac.yml
            release-safe/*.tar.gz
            release-safe/install.sh
      - name: Publish public release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
        run: |
          git fetch origin main --tags
          node scripts/safe/release-guard.ts "$RELEASE_TAG"
          cd release-safe
          shasum -a 256 --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_COMMIT" --latest --title "T3 Code $RELEASE_TAG" \
            --notes 'Managed macOS Apple Silicon build. Signed with the stable self-signed safe-fork identity; not Apple notarized. See docs/safe-fork/INSTALL.md for installation and policy limits.'
